<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="pipeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Node Card Gradient -->
    <linearGradient id="nodeCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131c2e" />
      <stop offset="100%" stop-color="#0b111c" />
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .header-tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #38bdf8; letter-spacing: 1.2px; }
    .header-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: #f8fafc; letter-spacing: -0.3px; }
    .header-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 500; fill: #94a3b8; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #e2e8f0; }
    .node-sub { font-family: 'SF Mono', Consolas, monospace; font-size: 11px; font-weight: 500; fill: #38bdf8; }
    .node-detail { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94a3b8; }
    .badge-label { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 700; fill: #10b981; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="996" height="276" rx="16" fill="url(#pipeBg)" stroke="url(#pipeBorder)" stroke-width="1.5" />

  <!-- Subtle Top Decorative Grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="250" y1="0" x2="250" y2="280" />
    <line x1="500" y1="0" x2="500" y2="280" />
    <line x1="750" y1="0" x2="750" y2="280" />
    <line x1="0" y1="60" x2="1000" y2="60" />
    <line x1="0" y1="170" x2="1000" y2="170" />
  </g>

  <!-- Section Header -->
  <g transform="translate(36, 26)">
    <text x="0" y="10" class="header-tag">SYSTEMS ARCHITECTURE &amp; VERIFICATION</text>
    <text x="0" y="32" class="header-title">Deterministic Binary Analysis &amp; Decompilation Pipeline</text>
    <text x="560" y="32" class="header-desc">Automated I/O Equivalence • Graph-RAG • Rust Kernels</text>
  </g>

  <!-- Pipeline Nodes -->
  <!-- Node 1: Binary Intake -->
  <g transform="translate(36, 85)">
    <rect width="205" height="155" rx="12" fill="url(#nodeCardBg)" stroke="#1e293b" stroke-width="1.5" />
    <!-- Indicator Bar -->
    <rect x="0" y="0" width="205" height="4" rx="2" fill="#3b82f6" />
    <circle cx="20" cy="26" r="6" fill="#3b82f6" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2" />
    <text x="36" y="30" class="node-title">Target Intake</text>
    <text x="20" y="52" class="node-sub">ELF • PE • WASM</text>
    <text x="20" y="78" class="node-detail">• Header structure parsing</text>
    <text x="20" y="98" class="node-detail">• Import table anchoring</text>
    <text x="20" y="118" class="node-detail">• Section mapping &amp; hashes</text>
    <text x="20" y="138" class="node-detail">• Byte-level validation</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(247, 155)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="url(#arrowGrad)" stroke-width="2" stroke-dasharray="3,3" />
    <polygon points="26,-4 34,0 26,4" fill="#38bdf8" />
  </g>

  <!-- Node 2: Graph Engine -->
  <g transform="translate(283, 85)">
    <rect width="205" height="155" rx="12" fill="url(#nodeCardBg)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="205" height="4" rx="2" fill="#0ea5e9" />
    <circle cx="20" cy="26" r="6" fill="#0ea5e9" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2" />
    <text x="36" y="30" class="node-title">Rust Engine Core</text>
    <text x="20" y="52" class="node-sub">Graph-RAG Index</text>
    <text x="20" y="78" class="node-detail">• Fast disassembly kernel</text>
    <text x="20" y="98" class="node-detail">• Call graph &amp; CFG extraction</text>
    <text x="20" y="118" class="node-detail">• Targeted function slicing</text>
    <text x="20" y="138" class="node-detail">• Zero-overhead Rust safety</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(494, 155)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="url(#arrowGrad)" stroke-width="2" stroke-dasharray="3,3" />
    <polygon points="26,-4 34,0 26,4" fill="#38bdf8" />
  </g>

  <!-- Node 3: Semantic Reconstruction -->
  <g transform="translate(530, 85)">
    <rect width="205" height="155" rx="12" fill="url(#nodeCardBg)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="205" height="4" rx="2" fill="#6366f1" />
    <circle cx="20" cy="26" r="6" fill="#6366f1" fill-opacity="0.3" stroke="#818cf8" stroke-width="2" />
    <text x="36" y="30" class="node-title">Semantics &amp; AST</text>
    <text x="20" y="52" class="node-sub">Bottom-Up Propagation</text>
    <text x="20" y="78" class="node-detail">• Leaf symbol recovery</text>
    <text x="20" y="98" class="node-detail">• Inferred signature typing</text>
    <text x="20" y="118" class="node-detail">• Crypto constant scans</text>
    <text x="20" y="138" class="node-detail">• Provenance tracking</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(741, 155)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="url(#arrowGrad)" stroke-width="2" stroke-dasharray="3,3" />
    <polygon points="26,-4 34,0 26,4" fill="#38bdf8" />
  </g>

  <!-- Node 4: Verification Rigor -->
  <g transform="translate(777, 85)">
    <rect width="187" height="155" rx="12" fill="url(#nodeCardBg)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="187" height="4" rx="2" fill="#10b981" />
    <circle cx="20" cy="26" r="6" fill="#10b981" fill-opacity="0.3" stroke="#34d399" stroke-width="2" />
    <text x="36" y="30" class="node-title">I/O Verification</text>
    <text x="20" y="52" class="node-sub">100% Equivalence</text>
    <text x="20" y="78" class="node-detail">• Differential CPU testing</text>
    <text x="20" y="98" class="node-detail">• Trace state matching</text>
    <text x="20" y="118" class="node-detail">• Register state checks</text>
    <text x="20" y="138" class="badge-label">✓ PROVEN CORRECT</text>
  </g>
</svg>
