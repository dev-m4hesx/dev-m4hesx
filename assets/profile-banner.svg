<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0c1220" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="topGlow" cx="20%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cornerGlow" cx="85%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Icon Gradient -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <style>
    .title-main { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 34px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .title-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 34px; font-weight: 800; fill: #38bdf8; letter-spacing: -0.5px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #60a5fa; letter-spacing: 0.8px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 500; fill: #94a3b8; }
    .highlight { font-weight: 600; fill: #e2e8f0; }
    .tag-text { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12px; font-weight: 600; fill: #cbd5e1; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="996" height="236" rx="16" fill="url(#bgGradient)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Glows -->
  <rect x="2" y="2" width="996" height="236" rx="16" fill="url(#topGlow)" pointer-events="none" />
  <rect x="2" y="2" width="996" height="236" rx="16" fill="url(#cornerGlow)" pointer-events="none" />

  <!-- Decorative Tech Grid Accent -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="240" />
    <line x1="320" y1="0" x2="320" y2="240" />
    <line x1="480" y1="0" x2="480" y2="240" />
    <line x1="640" y1="0" x2="640" y2="240" />
    <line x1="800" y1="0" x2="800" y2="240" />
    <line x1="0" y1="60" x2="1000" y2="60" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="180" x2="1000" y2="180" />
  </g>

  <!-- Left Icon Squircle -->
  <g transform="translate(48, 48)">
    <rect width="72" height="72" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <rect width="72" height="72" rx="18" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" fill="none" />
    <!-- Terminal / Binary Engine Glyph -->
    <path d="M22 26 L36 36 L22 46" stroke="url(#iconGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="42" y1="46" x2="52" y2="46" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="50" cy="26" r="3" fill="#10b981" />
  </g>

  <!-- Main Title & Subtitle -->
  <g transform="translate(142, 50)">
    <!-- Role Badge -->
    <rect x="0" y="0" width="260" height="26" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="14" cy="13" r="4" fill="#10b981" />
    <text x="26" y="17" class="badge-text">SYSTEMS &amp; FULL-STACK DEVELOPER</text>

    <!-- Main Title -->
    <text x="0" y="58" class="title-main">Mahesh <tspan class="title-sub">| Systems &amp; Web</tspan></text>

    <!-- Subtitle -->
    <text x="0" y="88" class="subtitle">Building <tspan class="highlight">deterministic binary analysis tools</tspan> &amp; <tspan class="highlight">high-performance web software</tspan></text>
  </g>

  <!-- Tech Tags Footer Bar -->
  <g transform="translate(48, 172)">
    <rect x="0" y="0" width="90" height="30" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" />
    <text x="45" y="19" text-anchor="middle" class="tag-text">Rust</text>

    <rect x="102" y="0" width="120" height="30" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" />
    <text x="162" y="19" text-anchor="middle" class="tag-text">TypeScript</text>

    <rect x="234" y="0" width="110" height="30" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" />
    <text x="289" y="19" text-anchor="middle" class="tag-text">React 19</text>

    <rect x="356" y="0" width="105" height="30" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" />
    <text x="408" y="19" text-anchor="middle" class="tag-text">Node.js</text>

    <rect x="473" y="0" width="155" height="30" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" />
    <text x="550" y="19" text-anchor="middle" class="tag-text">Binary Analysis</text>

    <rect x="640" y="0" width="125" height="30" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" />
    <text x="702" y="19" text-anchor="middle" class="tag-text">Tailwind v4</text>

    <rect x="777" y="0" width="175" height="30" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" />
    <text x="864" y="19" text-anchor="middle" class="tag-text">Deterministic RE</text>
  </g>
</svg>
